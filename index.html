<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First Notch Supplies – Tender Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{--brand:#D0000F;--ink:#38383A;--bg:#F4F4F5;--card:#fff;--line:#E0E0E2;--muted:#6B6B6F;--red:#C62828;--yel:#F2B705;--grn:#2E8B57;--redbg:#FDECEC;--yelbg:#FFF6D6;--grnbg:#E8F5EE;--yeltx:#5C4300;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#ECECEE;--bg:#232325;--card:#2E2E31;--line:#44444A;--muted:#A5A5AB;--brand:#F04050;--redbg:#4A2326;--yelbg:#463A12;--grnbg:#1F3A2C;--yeltx:#F6D56B}}
:root[data-theme="dark"]{--ink:#ECECEE;--bg:#232325;--card:#2E2E31;--line:#44444A;--muted:#A5A5AB;--brand:#F04050;--redbg:#4A2326;--yelbg:#463A12;--grnbg:#1F3A2C;--yeltx:#F6D56B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Source Sans 3",system-ui,sans-serif}
header{background:#fff;border-top:6px solid var(--brand);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header img{height:56px;width:auto}
header h1{font:700 22px "Libre Baskerville",Georgia,serif;margin:0;color:#38383A}
header p{margin:0;color:#6B6B6F;font-size:14px}
main{max-width:980px;margin:0 auto;padding:16px}
.note{background:var(--yelbg);color:var(--yeltx);border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:14px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.sum button{border:2px solid transparent;border-radius:10px;padding:12px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.sum b{display:block;font:700 30px "Libre Baskerville",Georgia,serif;line-height:1.1}
.sum span{font-size:14px}
.sum .r{background:var(--redbg);border-left:8px solid var(--red)}
.sum .y{background:var(--yelbg);border-left:8px solid var(--yel)}
.sum .g{background:var(--grnbg);border-left:8px solid var(--grn)}
.sum button.on{border-color:var(--ink)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.bar input[type=search]{flex:1 1 220px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
.chip{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
label.t{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.row{background:var(--card);border:1px solid var(--line);border-left:10px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:6px 14px}
.row.r{border-left-color:var(--red)}.row.y{border-left-color:var(--yel)}.row.g{border-left-color:var(--grn)}.row.c{opacity:.55}
.row h3{margin:0;font-size:17px;font-weight:700}
.meta{font-size:14px;color:var(--muted);grid-column:1}
.badge{grid-column:2;grid-row:1/3;align-self:start;text-align:right;border-radius:8px;padding:6px 10px;font-weight:700;min-width:116px}
.badge small{display:block;font-weight:400;font-size:12px}
.badge.r{background:var(--redbg);color:var(--red)}.badge.y{background:var(--yelbg);color:var(--yeltx)}.badge.g{background:var(--grnbg);color:var(--grn)}.badge.c{background:var(--line);color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.r{color:#FF8A8A}:root:not([data-theme="light"]) .badge.g{color:#6FD39B}}
.tags{grid-column:1/3;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:13px;border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.tag.w{border-color:var(--brand);color:var(--brand);font-weight:600}
select{margin-left:auto;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;background:var(--card);color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:32px}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}
.tabs{margin-left:auto;display:flex;gap:8px}
.add{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px}
.add input,.add select,#mon{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
.add b{flex:1 1 100%}
#report{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.rh{display:flex;gap:14px;align-items:center;border-bottom:3px solid var(--brand);padding-bottom:10px;margin-bottom:12px}
.rh img{height:52px;background:#fff}
.rh h2{font:700 20px "Libre Baskerville",Georgia,serif;margin:0}.rh p{margin:0;color:var(--muted);font-size:14px}
.sum2{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.sum2 div{background:var(--bg);border-radius:8px;padding:10px;font-size:14px}
.sum2 b{display:block;font:700 26px "Libre Baskerville",Georgia,serif}
#report h3{font-size:16px;margin:16px 0 6px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--bg)}
.n{text-align:right}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px}
@media print{.noprint,header,#tt{display:none!important}:root:not(#p){--ink:#222;--bg:#f2f2f2;--card:#fff;--line:#ccc;--muted:#555;--brand:#D0000F}body{background:#fff}main{padding:0;max-width:none}#report{border:0;padding:0}select,input{appearance:none;-webkit-appearance:none;border:0!important;padding:0!important;background:none!important;color:#222!important}@page{margin:14mm}}
#creport{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
#cl input,#ap input,#ap select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;background:var(--card);color:var(--ink);max-width:160px}
.add label.t input{margin-left:4px}
@media print{#creport{border:0;padding:0}}
.tabs .chip{border-radius:2px;background:#D0000F;border-color:#D0000F;color:#fff;font-weight:600}
.tabs .chip.on{background:#38383A;border-color:#38383A;color:#fff}
.tabs .chip:focus-visible{outline:3px solid #38383A;outline-offset:2px}
</style>
</head>

S=d.tenders.map(x=>({no:x.id,t:x.title,ent:x.entity,el:x.el,close:Date.parse(x.close),src:x.src,url:x.notice||x.url,tags:x.tags||[],seen:x.first_seen}));
banner();render();ra()}).catch(()=>{$("note").textContent="Could not load the tender list. Check that the daily scan has run."});
function banner(){const g=META.generated;if(!g){$("note").textContent="No scan has run yet. Run the daily scan once from the Actions tab on GitHub.";return}
const bad=Object.entries(META.sources).filter(([k,v])=>!v.ok).map(([k])=>k),nw=S.filter(x=>x.seen==today()).length;
$("note").textContent="Last scan: "+new Date(g).toLocaleString("en-KE",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+". "+nw+" new today."+(bad.length?" Problem reading: "+bad.join(", ")+". Showing earlier results for it.":"")+" Open the notice on each tender and confirm eligibility and the closing time before you bid."}
let st={};try{st=JSON.parse(localStorage.getItem("fn_apps2")||"{}")}catch(e){}
const OPTS=["Interested","Bidding","Applied","Won","Not won","Skipped"],AP=["Applied","Won","Not won"];
const f={women:1,open:1,unk:1,other:0,band:null};
const $=id=>document.getElementById(id);
function band(ms){if(ms<0)return"c";const d=Math.floor(ms/(24*H));return d<=2?"r":d<=7?"y":"g"}
function left(ms){if(ms<0)return"Closed";const d=Math.floor(ms/(24*H)),h=Math.floor(ms%(24*H)/H);return d>0?d+(d==1?" day ":" days ")+h+" hrs":h+" hrs"}
function fmt(ms){return new Date(ms).toLocaleString("en-KE",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
function elig(e){return e=="Women"?"women":e=="Open"?"open":e=="Unknown"?"unk":"other"}
function render(){
const q=$("q").value.toLowerCase(),sc=$("closed").checked;
let base=S.filter(x=>f[elig(x.el)]&&(sc||x.close>now)&&(x.t+x.ent+x.no).toLowerCase().includes(q)).sort((a,b)=>a.close-b.close);
const n={r:0,y:0,g:0};base.forEach(x=>{const b=band(x.close-now);if(n[b]!==undefined)n[b]++});
$("sum").innerHTML=[["r","Closing within 2 days"],["y","Closing in 3 to 7 days"],["g","8 or more days left"]].map(c=>`<button class="${c[0]} ${f.band==c[0]?"on":""}" data-b="${c[0]}"><b>${n[c[0]]}</b><span>${c[1]}</span></button>`).join("");
const rows=base.filter(x=>!f.band||band(x.close-now)==f.band);
$("list").innerHTML=rows.length?rows.map(x=>{const b=band(x.close-now),s=(st[x.no]||{}).s||"";
return `<article class="row ${b}"><h3>${x.t}</h3><div class="badge ${b}">${left(x.close-now)}<small>${fmt(x.close)}</small></div><div class="meta">${x.ent}, ${x.no}</div><div class="tags"><span class="tag ${x.el=="Women"?"w":""}">${x.el=="Open"?"Open tender":x.el=="Unknown"?"Eligibility: see notice":x.el+" (AGPO)"}</span><a class="tag" href="${esc(x.url)}" target="_blank" rel="noopener">${x.src} notice</a>${x.seen==today()?'<span class="tag w">New today</span>':""}${x.tags.map(g=>'<span class="tag">'+esc(g)+'</span>').join("")}<select data-n="${x.no}" aria-label="Bid status"><option value="">Not marked</option>${OPTS.map(o=>`<option ${s==o?"selected":""}>${o}</option>`).join("")}</select></div></article>`}).join(""):'<div class="empty">No tenders match these filters. Try clearing the search or turning on another filter.</div>'}
document.addEventListener("click",e=>{const c=e.target.closest(".chip[data-e]"),b=e.target.closest("[data-b]");
if(c){f[c.dataset.e]=f[c.dataset.e]?0:1;c.classList.toggle("on");render()}
if(b){f.band=f.band==b.dataset.b?null:b.dataset.b;render()}});

$("q").addEventListener("input",render);render();

const today=()=>new Date().toLocaleDateString("en-CA");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function save(){try{localStorage.setItem("fn_apps2",JSON.stringify(st))}catch(e){}}
function setStatus(no,v,i){if(!v){delete st[no]}else{const o=st[no]||{};st[no]={t:o.t||i.t,ent:o.ent||i.ent,d:o.d||(AP.includes(v)?today():""),s:v}}save()}
const wk=d=>{const n=+d.slice(8,10);return n<=7?1:n<=14?2:n<=21?3:4};
const WL=["Week 1 (1st to 7th)","Week 2 (8th to 14th)","Week 3 (15th to 21st)","Week 4 (22nd to end of month)"];
function ra(){
const m=$("mon").value||today().slice(0,7);
const L=Object.entries(st).filter(([k,v])=>AP.includes(v.s)&&(v.d||"").startsWith(m)).sort((a,b)=>a[1].d<b[1].d?-1:1);
const c=s=>L.filter(x=>x[1].s==s).length,w=c("Won"),n=c("Not won"),p=c("Applied");
$("rm").textContent=new Date(m+"-01").toLocaleDateString("en-GB",{month:"long",year:"numeric"})+". Printed "+new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
$("rs").innerHTML=[["Applied",L.length],["Won",w],["Not won",n],["Awaiting result",p],["Win rate",w+n?Math.round(w/(w+n)*100)+"%":"No results yet"]].map(a=>`<div><b>${a[1]}</b>${a[0]}</div>`).join("");
$("wk").innerHTML="<tr><th>Week</th><th class=n>Applications</th><th class=n>Won</th><th class=n>Not won</th><th class=n>Awaiting</th></tr>"+WL.map((l,i)=>{const g=L.filter(x=>wk(x[1].d)==i+1),k=s=>g.filter(x=>x[1].s==s).length;return `<tr><td>${l}</td><td class=n>${g.length}</td><td class=n>${k("Won")}</td><td class=n>${k("Not won")}</td><td class=n>${k("Applied")}</td></tr>`}).join("")+`<tr><th>Total</th><th class=n>${L.length}</th><th class=n>${w}</th><th class=n>${n}</th><th class=n>${p}</th></tr>`;
$("ap").innerHTML=L.length?"<tr><th>Date applied</th><th>Tender</th><th>Result</th><th class=noprint></th></tr>"+L.map(([k,v])=>`<tr><td><input type="date" value="${esc(v.d)}" data-dm="${esc(k)}" aria-label="Date applied"></td><td>${esc(v.t)}<br><span style="color:var(--muted)">${esc(v.ent)}${k.startsWith("MANUAL")?"":", "+esc(k)}</span></td><td><select data-m="${esc(k)}">${AP.map(o=>`<option value="${o}" ${v.s==o?"selected":""}>${o=="Applied"?"Applied, awaiting result":o}</option>`).join("")}</select></td><td class=noprint>${v.s=="Won"?`<button class="chip" data-ac="${esc(k)}">Add to contracts</button> `:""}<button class="x" data-x="${esc(k)}" aria-label="Remove">&times;</button></td></tr>`).join(""):'<tr><td class="empty">No applications recorded for this month yet. Mark a tender as Applied on the Tenders page, or add one above.</td></tr>'}
document.addEventListener("change",e=>{const t=e.target;
if(t.dataset.n){setStatus(t.dataset.n,t.value,S.find(x=>x.no==t.dataset.n))}
if(t.dataset.m){st[t.dataset.m].s=t.value;save()}
if(t.dataset.dm){st[t.dataset.dm].d=t.value;save()}
if(t.dataset.ci){const c=CT.find(x=>x.id==t.dataset.ci);if(c){c[t.dataset.ck]=t.value;sc()}}
if(t.id=="closed")render();ra();rc()});
document.addEventListener("click",e=>{const t=e.target.closest("[data-tab],[data-x],[data-cx],[data-ac]");if(!t)return;
if(t.dataset.x){delete st[t.dataset.x];save();ra();return}
if(t.dataset.cx){CT=CT.filter(x=>x.id!=t.dataset.cx);sc();rc();return}
if(t.dataset.ac){const k=t.dataset.ac,v=st[k];if(!CT.some(x=>x.no==k)){CT.push({id:"c"+Date.now(),t:v.t,ent:v.ent,no:k.startsWith("MANUAL")?"":k,v:"",s:"",e:""});sc()}document.querySelector("[data-tab=c]").click();return}
$("tt").hidden=t.dataset.tab!="t";$("aa").hidden=t.dataset.tab!="a";$("cs").hidden=t.dataset.tab!="c";
document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("on",b==t));ra();rc()});
$("abtn").onclick=()=>{const t=$("at").value.trim();if(!t){$("at").focus();return}
const k=$("an").value.trim()||"MANUAL-"+Date.now(),d=$("ad").value||today();
st[k]={t:t,ent:$("ae").value.trim(),d:d,s:$("as").value};save();
["at","ae","an","ad"].forEach(i=>$(i).value="");$("mon").value=d.slice(0,7);ra()};
$("prt").onclick=()=>window.print();
$("mon").value=today().slice(0,7);$("mon").addEventListener("input",ra);
$("rl").src=document.querySelector("header img").src;ra();

let CT=[];try{CT=JSON.parse(localStorage.getItem("fn_contracts")||"[]")}catch(e){}
function sc(){try{localStorage.setItem("fn_contracts",JSON.stringify(CT))}catch(e){}}
function cb(c){if(!c.e)return["c","Add end date"];const d=Math.ceil((new Date(c.e+"T23:59:59")-Date.now())/864e5);if(d<0)return["c","Ended"];return[d<=30?"r":d<=90?"y":"g",d==0?"Ends today":d+(d==1?" day":" days")+" left"]}
function rc(){
const L=CT.slice().sort((a,b)=>(a.e||"9")<(b.e||"9")?-1:1),act=L.filter(c=>cb(c)[0]!="c").length;
$("cm").textContent=act+" active "+(act==1?"contract":"contracts")+". Printed "+new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
const inp=(c,k,ty)=>`<input ${ty?'type="date"':'placeholder="Optional"'} value="${esc(c[k])}" data-ci="${c.id}" data-ck="${k}">`;
$("cl").innerHTML=L.length?"<tr><th>Contract</th><th>Value</th><th>Start date</th><th>End date</th><th>Time left</th><th class=noprint></th></tr>"+L.map(c=>{const b=cb(c);return `<tr><td>${esc(c.t)}<br><span style="color:var(--muted)">${esc(c.ent)}${c.no?(c.ent?", ":"")+esc(c.no):""}</span></td><td>${inp(c,"v")}</td><td>${inp(c,"s",1)}</td><td>${inp(c,"e",1)}</td><td><span class="badge ${b[0]}" style="min-width:0;display:inline-block;text-align:left">${b[1]}</span></td><td class=noprint><button class="x" data-cx="${c.id}" aria-label="Remove">&times;</button></td></tr>`}).join(""):'<tr><td class="empty">No current contracts yet. Add one above, or mark a tender as Won and choose Add to contracts.</td></tr>'}
$("cbtn").onclick=()=>{const t=$("ct").value.trim();if(!t){$("ct").focus();return}
CT.push({id:"c"+Date.now(),t:t,ent:$("ce").value.trim(),no:$("cn2").value.trim(),v:$("cv").value.trim(),s:$("cst").value,e:$("cen").value});sc();
["ct","ce","cn2","cv","cst","cen"].forEach(i=>$(i).value="");rc()};
$("cprt").onclick=()=>window.print();
$("rl2").src=document.querySelector("header img").src;rc();
</script>
</body>
</html>
